name: Deploy

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Select the Cloudflare Pages target
        type: choice
        options:
          - dev
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Test is on manual trigger only: pushes and releases are already tested
  # by the required checks on the pull request (see the main ruleset)
  tests:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Build and deploy to Cloudflare Pages
    needs: tests
    # Run when tests passed or were skipped
    if: ${{ always() && !cancelled() && needs.tests.result != 'failure' }}
    runs-on: ubuntu-latest
    # The environment provides the TYPEDOC_SITE_URL and PAGES_BRANCH variables:
    # release -> production, manual run -> the selected target,
    # push to main -> preview, push to dev -> dev
    environment:
      name: >-
        ${{
          github.event_name == 'release' && 'production'
          || inputs.target
          || github.ref_name == 'main' && 'preview'
          || 'dev'
        }}
      url: ${{ vars.TYPEDOC_SITE_URL }}
    steps:
      # Safety guard for manual trigger. Production can run only on main
      - name: Refuse production from a non-main ref
        if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys must run from main" >&2
          exit 1

      - uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.11.2
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docs:build reads cleanJsdocTheme.siteUrl from typedoc.json
      - name: Set TypeDoc site URL
        env:
          TYPEDOC_SITE_URL: ${{ vars.TYPEDOC_SITE_URL }}
        run: |
          test -n "$TYPEDOC_SITE_URL" || { echo "TYPEDOC_SITE_URL is not set" >&2; exit 1; }
          sed -i -E "s|\"siteUrl\": \"[^\"]*\"|\"siteUrl\": \"$TYPEDOC_SITE_URL\"|" typedoc.json
          grep -q "\"siteUrl\": \"$TYPEDOC_SITE_URL\"" typedoc.json

      - name: Stage site
        run: pnpm run site:stage

      - name: Check the Pages branch
        env:
          PAGES_BRANCH: ${{ vars.PAGES_BRANCH }}
        run: |
          test -n "$PAGES_BRANCH" || { echo "PAGES_BRANCH is not set" >&2; exit 1; }

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ vars.PAGES_BRANCH }}
